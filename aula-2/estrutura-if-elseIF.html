<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        let pesoPessoa = 85; 
        let alturaPessoa = 1.75; 
        let calculoIMC;
        
        calculoIMC = pesoPessoa / (alturaPessoa * alturaPessoa);

        if (calculoIMC < 18.5) {
            document.write("Abaixo do peso");
        } else if (calculoIMC <= 24.9) {
            document.write("Peso normal");
        } else if (calculoIMC <= 29.9) {
            document.write("Sobrepeso"); 
        } else if (calculoIMC <= 34.9) {
            document.write("Obesidade grau 1");
        } else if (calculoIMC <= 39.9) {
            document.write("obesidade grau 2");
        } else {
            document.write("obesidade grau 3");
        }
        

    </script>
    
</body>
</html>
